schema_version: '1.0'
status: design_reference_not_implemented
reasoning:
  enabled: false
  ontology_path: knowledge/ontology/retail.v1.yaml
  pg_path: knowledge/pg/inventory_restock.v1.json
  execution_mode: serial
  hops: 2
  recent_events: 3
  guidance_model: null
  guidance_timeout_s: 8
  guidance_max_tokens: 500
  context_budget_tokens: 2000
  max_recovery_reads: 1
  observation_ttl_s: 60
  plan_ttl_s: 300
  evolution_enabled: false
  audit_store: runtime/reasoning.sqlite
notes:
- 以上为新增ReasoningConfig，不是现有MerchantAgentConfig字段。
- 核心执行保护独立于enabled；enabled只控制新增语义上下文与PG指导。
- null guidance_model表示显式继承已验证solver模型，运行时记录最终ID。
- 公开配置不能包含密钥；生产授权与业务事务仍需实现。
