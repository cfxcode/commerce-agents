name: semantic-build-support
on:
  pull_request:
    paths:
      - '.github/workflows/semantic-build-support.yml'
permissions:
  contents: read
jobs:
  wheelhouse:
    if: github.repository == 'cfxcode/commerce-agents' && github.event.pull_request.number == 1 && github.head_ref == 'feat/semantic-context-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Collect pinned third-party wheels for offline validation
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = []
          for name in ('requirements.txt', 'requirements-dev.txt'):
              lines.extend(line for line in Path(name).read_text().splitlines() if '==' in line and not line.lstrip().startswith('#'))
          Path('/tmp/semantic-dependencies.txt').write_text('\n'.join(lines) + '\n')
          PY
          python -m pip download --only-binary=:all: --dest wheelhouse -r /tmp/semantic-dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-offline-wheels-py313
          path: wheelhouse/
          retention-days: 1
          if-no-files-found: error
