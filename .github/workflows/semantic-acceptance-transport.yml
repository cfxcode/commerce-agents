name: semantic-acceptance-transport
on:
  pull_request:
    paths:
      - '.acceptance-transfer/**'
      - '.github/workflows/semantic-acceptance-transport.yml'
permissions:
  contents: read
jobs:
  verified-source:
    if: github.repository == 'cfxcode/commerce-agents' && github.event.pull_request.number == 1 && github.head_ref == 'feat/semantic-context-closure' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize verified source
        run: python .acceptance-transfer/materialize.py apply
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Offline checks
        run: |
          mkdir -p acceptance-evidence
          set -o pipefail
          python -m ruff check . --extend-exclude .acceptance-transfer
          python -m ruff format --check . --extend-exclude .acceptance-transfer
          python -m pytest -q --junitxml=acceptance-evidence/tests.xml | tee acceptance-evidence/tests.txt
          python scripts/check.py | tee acceptance-evidence/repository.txt
          python -m commerce_reasoning.cli preflight-guidance --config configs/experiments/p-closure.yaml --knowledge-source working --out acceptance-evidence/full-guidance.json
      - name: Export verified blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .acceptance-transfer/materialize.py export
      - name: Preserve non-sensitive validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-acceptance-export-${{ github.event.pull_request.head.sha }}
          path: acceptance-evidence/
          retention-days: 7
          if-no-files-found: warn
