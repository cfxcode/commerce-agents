name: semantic-browser
on:
  pull_request:
    paths:
      - 'commerce-reasoning/**'
      - 'knowledge/**'
      - 'configs/**'
      - 'scripts/*semantic*'
      - 'examples/retail/merchant-web/**'
      - '.github/workflows/semantic-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          cd examples && npm ci
      - name: Build and start the real retail UI
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: |
          mkdir -p runtime/browser-acceptance
          cd examples
          npm run build --workspace acme-retail-merchant-web
          npm run start --workspace acme-retail-merchant-web > ../runtime/browser-acceptance/ui-server.log 2>&1 &
          cd ..
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Exercise desktop/mobile approval, decline, history and degradation
        run: python scripts/check_semantic_browser.py --out runtime/browser-acceptance
      - name: Preserve fictional-fixture browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-browser-${{ github.sha }}
          path: runtime/browser-acceptance/
          retention-days: 7
