name: semantic-materialize
on:
  pull_request:
    paths:
      - '.semantic-transfer/**'
      - '.github/workflows/semantic-materialize.yml'
permissions:
  contents: read
jobs:
  verified-source:
    if: github.repository == 'cfxcode/commerce-agents' && github.event.pull_request.number == 1 && github.head_ref == 'feat/semantic-context-closure' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}/examples
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify transport and apply exact locally tested source
        run: python .semantic-transfer/materialize.py apply
      - name: Install pinned repository dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and formatting
        run: |
          python -m ruff check . --extend-exclude .semantic-transfer
          python -m ruff format --check . --extend-exclude .semantic-transfer
      - name: Run full offline test suite
        run: |
          mkdir -p semantic-materialize-evidence
          set -o pipefail
          python -m pytest -q --junitxml=semantic-materialize-evidence/tests.xml | tee semantic-materialize-evidence/tests.txt
          python scripts/check.py | tee semantic-materialize-evidence/repository-check.txt
      - name: Validate all semantic contexts and safety evidence
        run: |
          python -m commerce_reasoning.cli validate-knowledge --config configs/reasoning.yaml --knowledge-source published
          python -m commerce_reasoning.cli preflight-semantics --config configs/experiments/p-closure.yaml --knowledge-source working --out runtime/semantic-preflight.json
          python -m commerce_reasoning.cli verify-semantics --config configs/experiments/p-closure.yaml --knowledge-source working --out runtime/semantic-verification/report.json
          cp runtime/semantic-preflight.json semantic-materialize-evidence/
          cp runtime/semantic-verification/report.json semantic-materialize-evidence/semantic-verification.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - name: Validate bilingual retail and build eight web apps
        run: |
          set -o pipefail
          node scripts/check_retail_i18n.cjs | tee semantic-materialize-evidence/i18n.txt
          cd examples
          npm ci
          npm run build | tee ../semantic-materialize-evidence/web-build.txt
      - name: Export only verified Git blobs (no ref or release changes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .semantic-transfer/materialize.py export
      - name: Preserve validation results without runtime databases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-materialized-${{ github.event.pull_request.head.sha }}
          path: semantic-materialize-evidence/
          retention-days: 7
          if-no-files-found: warn
